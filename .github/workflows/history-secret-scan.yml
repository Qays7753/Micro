name: History secret scan

# D-16 / OD-SEC (R11 W1b-5 — 2026-10-14، قرار المالك A_PLUS_C — NON_BLOCKING_RECURRING):
# مسح أسرار تاريخ Git الدوري + اليدوي على مرآة نظيفة، بنفس جدول أنماط حارس
# شجرة العمل المشترك حرفيًا (scripts/check-secrets.mjs — لا جدول أضعف).
#
# العقد:
# - غير معطل للدمج (non-blocking): لا يعمل على PRs إطلاقًا — مجدول شهريًا
#   + تشغيل يدوي صريح فقط.
# - أحمر عند الاكتشاف (خروج 1) أو خطأ الماسح (خروج 2) — فشل المسح لا يظهر
#   نجاحًا أبدًا (لا خطوة تُخفي فشلها بوصفه نجاحًا).
# - Least privilege: صلاحية قراءة وحدها، لا write token، persist-credentials:
#   false، ومرجع action واحد مثبت بالبصمة الكاملة نفسها المعتمدة في ci.yml.
# - المخرجات بصمات فقط (SHA-256 غير عكسي 16 خانة) — لا نص مطابقة ولا قيمة
#   سر أبدًا؛ الماسح نفسه يفشل ذاتيًا (REDACTION_FAILURE) لو تسرب نص.
# - الإشعار = حالة التشغيل نفسها (أحمر مرئي للمالك مع بريد GitHub الافتراضي
#   لتشغيلات الجدولة الفاشلة)؛ لا فتح issues تلقائيًا ولا تعليقات PR — كلاهما
#   يحتاج صلاحيات كتابة غير ضرورية لهذا الغرض.
# - لا إعادة كتابة تاريخ ولا rotation تلقائية — القرار دائمًا للمالك.
# - المسح الواحدي S0 (ZERO_FINDINGS تحت التعداد الخصومي الكامل) محفوظ كما هو:
#   docs/architecture/refactoring/r11-s0-w1a-20261013/evidence/R11-S0-GIT-HISTORY-SECRET-SCAN-2026-10-13.md

on:
  schedule:
    # شهريًا: الساعة 06:00 UTC أول يوم من كل شهر (التاريخ لا ينمو إلا بالدمج).
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: history-secret-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (scanner source only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # الماسح وحده محتاج من الشجرة؛ لا اعتمادًا محفوظًا بعد الخطوة.
          persist-credentials: false
          # عمق سطح يكفي لجلب الماسح (المرآة أدناه هي التي تحمل التاريخ كله).
          fetch-depth: 1

      - name: Clone a fresh mirror (all refs, anonymous read)
        run: |
          set -euo pipefail
          git clone --mirror "${{ github.server_url }}/${{ github.repository }}.git" "$RUNNER_TEMP/micro-history.git"
          git -C "$RUNNER_TEMP/micro-history.git" rev-parse --is-bare-repository

      - name: Scan the full history (fingerprint-only output)
        run: |
          set -euo pipefail
          node scripts/security/scan-git-history-secrets.mjs "$RUNNER_TEMP/micro-history.git" --report "$RUNNER_TEMP/history-scan-report.json"

      - name: Publish the sanitized report (count + fingerprints only)
        if: always()
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/history-scan-report.json" ]; then
            node -e 'const r = require(process.argv[1]); console.log(`history-secret-scan: ${r.result} — refs ${r.scanned.refs}, commits ${r.scanned.commits}, blobs ${r.scanned.blobs}, blob-path entries ${r.scanned.blob_path_entries}, findings ${(r.findings ?? []).length}, redaction ${r.redaction}`);' "$RUNNER_TEMP/history-scan-report.json"
            cat "$RUNNER_TEMP/history-scan-report.json"
          else
            echo "history-secret-scan: NO REPORT PRODUCED — the scanner step failed before writing a report (this step is informational only; the scan step already failed the run)."
          fi
