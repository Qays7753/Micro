name: CI

on:
  push:
    branches:
      - main
    tags: ["v*"]
  pull_request:
  # تنفيذ يدوي عند الحاجة (إعادة تحقق لأي مرجع بلا دفع جديد) — لا يشغّل
  # نفسه أبدًا؛ القرار يدويًا صريحًا.
  workflow_dispatch:

permissions:
  contents: read

# المجموعة ٦ (تدقيق A1 — AR-01/AR-03/AR-10): إصدار قابل للتتبع ومهذب.
# - الوسم v* يشغّل الفحوص نفسها (لا مراجعة خضراء فوق main وحدها بلا أثر محفوظ)،
#   ونتاج البناء يُرفع أثرًا قابلًا للتنزيل من كل تشغيل موسوم.
# - فحص الثغرات يعاد محاولته بحدّ أقصى (انقطاعات سجل npm موثقة في PRs #150-#152)
#   بدل تعطيله أو إفراغ إعادة الدفع — سياسة موثقة في CONTRIBUTING.md.
# - مجموعة التزامن توقف التشغيلات المتراكمة على نفس المرجع، ومدة قصوى تحمي
#   من تشغيل معلّق بلا نهاية.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Stage B (S13/M-F3، 2026-11-14): حاوية خدمة PostgreSQL تحل محل إقلاع
    # PostgreSQL المدمج داخل `pnpm prototype:test`. الثنائيات المدمجة
    # (@embedded-postgres/linux-x64@17.5.0-beta.15) مترابطة مع libicuuc.so.60
    # التي لم تعد صورة ubuntu-latest تحملها — وهو السبب الجذري الوحيد لفشل
    # التشغيلين 43491920672 (رأس 52b3030e) و43519977749 (رأس 4c93e04c) عند
    # خطوة initdb نفسها. `MICRO_TEST_PG_CONNECTION` هي مسار التجاوز المدعوم
    # في الكود أصلًا (apps/prototype-web/scripts/pg-test-server.mjs) — لا اختبار
    # يُتخطى أو يُضعف أو يُعاد إرساؤه: المجموعات نفسها تعمل فوق PostgreSQL 17
    # حقيقي بنسخة مطابقة للمدمجة (17.5). المصادقة trust على localhost فقط —
    # نفس وضع الخادم المدمج نفسه (initdb --auth=trust)، وسلسلة الاتصال بلا
    # كلمة مرور فلا تلمس حراسة الأسرار (db-url-with-credentials تلتقط
    # user:pass@ حصرًا).
    services:
      postgres:
        # CI-002 (Post-Group 6 Wave 5 / DOC-041): the service image is pinned
        # by IMMUTABLE digest (postgres:17.5 @
        # sha256:aadf2c0696f5ef357aa7a68da995137f0cf17bad0bf6e1f17de06ae5c769b302)
        # — a moving tag can silently change the CI database under us; the
        # digest cannot. The tag stays for human readability.
        image: postgres:17.5@sha256:aadf2c0696f5ef357aa7a68da995137f0cf17bad0bf6e1f17de06ae5c769b302
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MICRO_TEST_PG_CONNECTION: postgres://postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        # R10-B5/F-025 (2026-10-13): تثبيت الإصدار بالبصمة الكاملة (SHA) لا
        # الوسم العائم، وpersist-credentials: false — لا اعتمادًا محفوظًا بعد
        # الخطوة (المستودع عام فجلب قاعدة الدمج اللاحق مجهول الهوية يكفي).
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # عقد الإغلاق العميق (CI): تاريخ كامل — فحص المسافات البيضاء في PR
          # يحسب قاعدة الدمج (base...HEAD) فلا يصلح مع الجلب السطحي (no merge base).
          fetch-depth: 0
          persist-credentials: false

      # SEC-GIT-001 (Post-Group 6 Wave 5 / DOC-041، 2026-11-21): فحص أسرار
      # المدى الجديد لكل دفعة — السر الذي دُفع ثم أُزيل في التزام لاحق لا
      # يراه فحص الشجرة الحية أبدًا؛ هذا الفحص يسحب كل التزامات المدى
      # الجديد ويفحص محتوى ملفاته بأنماط حارس الأسرار الحي نفسها،
      # بمخرجات منقّحة (نمط/ملف/سطر/التزام — لا نص مطابق أبدًا).
      # المدى: push = before..sha (وعند إنشاء فرع: main...HEAD)؛
      # pull_request = قاعدة الدمج...HEAD؛ dispatch = main...HEAD.
      - name: Scan the pushed range for secrets (SEC-GIT-001)
        run: |
          set -eu
          BEFORE=""
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            case "$BEFORE" in
              ""|0000000000000000000000000000000000000000) BEFORE="origin/main" ;;
            esac
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.event.pull_request.base.ref }}"
            BEFORE="origin/${{ github.event.pull_request.base.ref }}"
          else
            BEFORE="origin/main"
          fi
          echo "scanning range: $BEFORE..HEAD"
          node scripts/check-secrets-range.mjs "$BEFORE" HEAD

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # R10-B5/F-025: تثبيت الإصدار الفردي الدقيق — نفس الإصدار الذي قاسته
          # مراسي الأسطح لبيئة github-actions (v22.23.3 / zlib 1.3.1) فلا
          # انحراف بيئة عن القياسات المرساة.
          node-version: 22.23.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit dependencies (bounded retry for registry outages)
        # الخطوة ٢ (برنامج تصحيح ما بعد المسح لPR #316 — 2026-10-06): أُصلح
        # انتقال خرج الفشل وانتقل المنطق إلى scripts/ci-audit-step.sh ليكون
        # قابلًا للاختبار الانحداري (scripts/ci-audit-step.test.mjs). العلة
        # الأصلية: كان `code=$?` يُلتقط بعد جملة if كاذبة فيرصد 0 دائمًا،
        # فتنجح الخطوة رغم فشل pnpm audit ثلاث مرات (الشاهد: تشغيل 37328419419
        # أخضر مع مكتشف high واحد). الفاحص الداخلي (ci-audit-check.mjs) يطبّق
        # سجل الاستثناءات الأمنية الموثق — PROPOSED يحجب حتى قرار المالك.
        run: bash scripts/ci-audit-step.sh

      # F-05c (post-scan program W1 — 2026-10-05): the standalone "Lint source
      # and tests" step was removed — `pnpm check` (next step) already runs
      # `pnpm lint` (package.json check chain), so lint executed twice per CI
      # run. The lint gate itself is unchanged and still enforced once, inside
      # the full verification step; the local aggregate `pnpm check` keeps
      # linting as before. No guard was weakened.
      - name: Verify domain and prototype
        run: pnpm check

      - name: Verify no whitespace errors (PR checklist rule automated)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          git diff --check "origin/${{ github.event.pull_request.base.ref }}...HEAD"

      - name: Upload production PWA build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: micro-pwa-${{ github.sha }}
          path: apps/prototype-web/dist/public
          retention-days: 30
          if-no-files-found: error
