<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- P-004: viewport-fit=cover يفعّل هوامش الأمان في الحواف (الآيفون وغيره) —
         قيم env(safe-area-inset-*) الموجودة في نظام التصميم تصبح فعلية بدل صفر دائمًا. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- §4 بند ١٩: شريط النظام يتبع المظهر — وسمان بوسم إعلامي لكل مخطط -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1917" />
    <meta name="description" content="Micro: شريك مالي وتشغيلي محلي لصاحب المشروع." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Micro" />
    <link rel="icon" type="image/png" sizes="192x192" href="/micro-mark-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/micro-mark-192.png" />
    <!-- S5-01: خطوط IBM Plex مستضافة محليًا (OFL) — لا نداءات شبكة إطلاقًا،
         وتُخزَّن مسبقًا في PWA precache مع بقية الأصول. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>Micro — شريك مشروعك</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Q-003/§11 (دورة التدقيق النهائي): أزيل وسم تحليلات معطل كان يشحن في الإنتاج
         بقيم %VITE_ANALYTICS_*% غير معرفة أبدًا في هذا المستودع — التطبيق محلي
         أولًا بلا نداءات شبكة، ولا مكان لمسار تحليلات غير مفعل. -->
  </body>
</html>
