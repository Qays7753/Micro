<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- P-004: viewport-fit=cover يفعّل هوامش الأمان في الحواف (الآيفون وغيره) —
         قيم env(safe-area-inset-*) الموجودة في نظام التصميم تصبح فعلية بدل صفر دائمًا. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- §4 بند ١٩: شريط النظام يتبع المظهر — وسمان بوسم إعلامي لكل مخطط -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1917" />
    <meta name="description" content="Micro: شريك مالي وتشغيلي محلي لصاحب المشروع." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Micro" />
    <link rel="icon" type="image/png" sizes="192x192" href="/micro-mark-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/micro-mark-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Micro — شريك مشروعك</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"
    ></script>
  </body>
</html>
